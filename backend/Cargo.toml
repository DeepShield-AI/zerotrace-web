[package]
name = "zerotrace-web"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "mysql", "chrono", "rust_decimal"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
rand = "0.10.1"
async-trait = "0.1"
sha2 = "0.11.0"
hex = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
jsonwebtoken = "10.4.0"
axum-extra = { version = "0.12.6", features = ["cookie"] }
tower = "0.5.3"
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }
futures = "0.3"
anyhow = "1"
rust_decimal = { version = "1", features = ["serde"] }
time = { version = "0.3.51", features = ["macros"] }
