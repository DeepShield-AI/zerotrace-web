---
# ============================================================
# Gateway — API 网关 (NodePort 暴露到集群外)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: chaos-demo
  labels:
    app: gateway
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
      name: http
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: chaos-demo
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: localhost/zerotrace-chaos-demo:latest
          imagePullPolicy: Never
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "dev:gateway"]
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: GATEWAY_PORT
              value: "3000"
            - name: USERS_SRV
              value: "http://users:3001"
            - name: PRODUCTS_SRV
              value: "http://products:3002"
            - name: ORDERS_SRV
              value: "http://orders:3003"
            - name: CHAOS_SRV
              value: "http://chaos:3004"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5

