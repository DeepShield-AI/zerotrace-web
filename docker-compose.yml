# Zerotrace Web — API + Frontend SPA + Agent Installer
#
# Usage:
#   docker compose up -d
#
services:
  web:
    image: 47.97.67.233:5000/deepshield/zerotrace-web:latest
    container_name: zerotrace-web
    restart: always
    environment:
      DATABASE_URL: mysql://root:deepflow@deepflow-mysql:30130/deepflow
      ZEROTRACE_SERVER_URL: http://deepflow-server:20417
      ZEROTRACE_METERING_URL: http://deepflow-server:20417
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SESSION_COOKIE_NAME: zt_session
      BIND_ADDR: 0.0.0.0:3001
      STATIC_DIR: /app/static
      CLICKHOUSE_URL: http://deepflow-clickhouse:8123
      CONTROLLER_IP: ${CONTROLLER_IP:-}
      RUST_LOG: info
      TZ: Asia/Shanghai
    ports:
      - "${WEB_PORT:-3001}:3001"
    networks:
      - zerotrace
      - deepflow

networks:
  zerotrace:
    name: zerotrace_zerotrace
    driver: bridge
    external: true
  deepflow:
    name: deepflow-docker-compose_deepflow
    driver: bridge
    external: true
